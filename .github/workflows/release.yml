name: Release

on:
  push:
    branches: [main, next]

permissions:
  contents: write
  id-token: write
  issues: write
  discussions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Audit signatures
        run: npm audit signatures

      - name: Prune package.json
        uses: igordanchenko/actions/prune-package-json@d460545dc978b327e8d2b2cfe0acb86075a660c1 # v1.3.2

      - name: Release
        uses: igordanchenko/actions/semantic-release@d460545dc978b327e8d2b2cfe0acb86075a660c1 # v1.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
