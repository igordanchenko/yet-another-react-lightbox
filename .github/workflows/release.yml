name: Release

on:
  push:
    branches: [main, next]

permissions:
  issues: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Size
        run: npm run size

      - name: Audit signatures
        run: npm audit signatures

      - name: Record bundle size
        uses: igordanchenko/actions/bundle-size@6007abe989a1243da59096371e23ce02e4566f76 # v1.3.3

      - name: Prune package.json
        uses: igordanchenko/actions/prune-package-json@6007abe989a1243da59096371e23ce02e4566f76 # v1.3.3

      - name: Release
        uses: igordanchenko/actions/semantic-release@6007abe989a1243da59096371e23ce02e4566f76 # v1.3.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
